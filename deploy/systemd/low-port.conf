# Drop-in to let gr_report listen on a privileged port such as 443.
#
#   install -D -m 0644 deploy/systemd/low-port.conf \
#       /etc/systemd/system/gr_report.service.d/low-port.conf
#   set GR_REPORT_ADDR=:443 in /etc/gr_report/gr_report.env
#   systemctl daemon-reload && systemctl restart gr_report
#
# The capability is only used for bind(); the process drops every capability
# right after the listening socket is open.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
# A private user namespace would make the capability useless for host ports.
PrivateUsers=no
