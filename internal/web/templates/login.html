{{define "content"}}
<h1>gr_report</h1>
<form class="panel" method="post" action="/login"{{if .Error}} aria-describedby="error"{{end}}>
  <h2>{{$.T "Log in"}}</h2>
  <label for="username">{{$.T "Username"}}</label>
  <input type="text" id="username" name="username" value="{{.Data}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">{{$.T "Password"}}</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <div class="actions"><button>{{$.T "Log in"}}</button></div>
</form>
{{end}}
