{{define "content"}}
<h1>{{$.T "Change password"}}</h1>
{{if .User.MustChange}}<p class="notice">{{$.T "You are using a one-time password. Choose your own password to continue."}}</p>{{end}}
<form class="panel" method="post" action="/password"{{if .Error}} aria-describedby="error"{{end}}>
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label for="current">{{$.T "Current password"}}</label>
  <input type="password" id="current" name="current" autocomplete="current-password" required>
  <label for="new">{{$.T "New password"}} <span class="help" id="new-help">{{$.T "at least 10 characters"}}</span></label>
  <input type="password" id="new" name="new" autocomplete="new-password" minlength="10" required aria-describedby="new-help">
  <label for="confirm">{{$.T "Repeat new password"}}</label>
  <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="10" required>
  <div class="actions"><button>{{$.T "Change password"}}</button></div>
</form>
{{end}}
