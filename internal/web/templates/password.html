{{define "content"}}
<h1>Change password</h1>
{{if .User.MustChange}}<p class="flash">You are using a one-time password. Choose your own password to continue.</p>{{end}}
<form class="panel" method="post" action="/password">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label for="current">Current password</label>
  <input type="password" id="current" name="current" autocomplete="current-password" required>
  <label for="new">New password <span class="help">at least 10 characters</span></label>
  <input type="password" id="new" name="new" autocomplete="new-password" minlength="10" required>
  <label for="confirm">Repeat new password</label>
  <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="10" required>
  <div class="actions"><button>Change password</button></div>
</form>
{{end}}
