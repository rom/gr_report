version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (*github.com/rom/gr_report/internal/store.Store).Close
        - syscall.Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - os.Remove
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
